<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin and blockchain animation</title>
  <desc id="desc">A Bitcoin coin sends a transaction along a chain of blocks until the newest block is confirmed.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7931a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#f7931a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb04a"/>
      <stop offset="55%" stop-color="#f7931a"/>
      <stop offset="100%" stop-color="#d4700c"/>
    </linearGradient>
    <clipPath id="coinClip"><circle r="64"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    /* coin */
    .float { animation: float 3.2s ease-in-out infinite; }
    .glow  { animation: glow 3.2s ease-in-out infinite; }
    .flip  { animation: flip 6s cubic-bezier(.45,0,.55,1) infinite; }
    .shine { animation: shine 6s ease-in-out infinite; }

    /* transaction travelling along the chain */
    .pulse { opacity: 0; animation: travel 4s linear infinite; }

    /* newest block being mined, then confirmed */
    .mining  { animation: march 1s linear infinite; }
    .confirm { opacity: 0; animation: confirm 4s ease-out infinite; }
    .tx1 { animation: tx1 4s steps(1) infinite; }
    .tx2 { animation: tx2 4s steps(1) infinite; }
    .tx3 { animation: tx3 4s steps(1) infinite; }
    .lbl-mining { animation: lblMining 4s steps(1) infinite; }
    .lbl-ok     { opacity: 0; animation: lblOk 4s steps(1) infinite; }

    .cursor { animation: blink 1.1s steps(1) infinite; }

    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes glow    { 0%,100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes flip    { 0%,72% { transform: scaleX(1); } 80% { transform: scaleX(.04); } 88%,100% { transform: scaleX(1); } }
    @keyframes shine   { 0%,30% { transform: translateX(0); } 52%,100% { transform: translateX(230px); } }
    @keyframes travel  {
      0%      { transform: translateX(0);     opacity: 0; }
      6%      { opacity: 1; }
      58%     { transform: translateX(577px); opacity: 1; }
      62%,100%{ transform: translateX(577px); opacity: 0; }
    }
    @keyframes march   { to { stroke-dashoffset: -26; } }
    @keyframes confirm { 0%,56% { opacity: 0; } 62%,80% { opacity: 1; } 94%,100% { opacity: 0; } }
    @keyframes tx1     { 0% { opacity: 0; } 14% { opacity: 1; } 92% { opacity: 0; } }
    @keyframes tx2     { 0% { opacity: 0; } 28% { opacity: 1; } 92% { opacity: 0; } }
    @keyframes tx3     { 0% { opacity: 0; } 42% { opacity: 1; } 92% { opacity: 0; } }
    @keyframes lblMining { 0% { opacity: 1; } 60% { opacity: 0; } 92% { opacity: 1; } }
    @keyframes lblOk     { 0% { opacity: 0; } 60% { opacity: 1; } 92% { opacity: 0; } }
    @keyframes blink   { 0% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .float, .glow, .flip, .shine, .pulse, .mining, .confirm,
      .tx1, .tx2, .tx3, .lbl-mining, .lbl-ok, .cursor { animation: none !important; }
    }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="858" height="238" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- headline -->
  <text x="248" y="66" class="mono" font-size="20" fill="#e6edf3">
    <tspan fill="#f7931a">&gt;</tspan> stacking sats &amp; shipping code<tspan class="cursor" fill="#f7931a">_</tspan>
  </text>

  <!-- chain links -->
  <g stroke-linecap="round">
    <line x1="189" y1="130" x2="248" y2="130" stroke="#f7931a" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 6"/>
    <g stroke="#30363d" stroke-width="2">
      <line x1="308" y1="130" x2="370" y2="130"/>
      <line x1="430" y1="130" x2="492" y2="130"/>
      <line x1="552" y1="130" x2="614" y2="130"/>
      <line x1="674" y1="130" x2="736" y2="130"/>
    </g>
    <g fill="#0d1117" stroke="#484f58" stroke-width="2">
      <rect x="328" y="125" width="22" height="10" rx="5"/>
      <rect x="450" y="125" width="22" height="10" rx="5"/>
      <rect x="572" y="125" width="22" height="10" rx="5"/>
      <rect x="694" y="125" width="22" height="10" rx="5"/>
    </g>
  </g>

  <!-- transaction pulse (drawn under the blocks so it hops between them) -->
  <circle class="pulse" cx="189" cy="130" r="4.5" fill="#f7931a"/>

  <!-- confirmed blocks, older ones fade back -->
  <g fill="#161b22" stroke="#f7931a" stroke-width="2">
    <rect x="248" y="100" width="60" height="60" rx="10" stroke-opacity=".35"/>
    <rect x="370" y="100" width="60" height="60" rx="10" stroke-opacity=".5"/>
    <rect x="492" y="100" width="60" height="60" rx="10" stroke-opacity=".65"/>
    <rect x="614" y="100" width="60" height="60" rx="10" stroke-opacity=".8"/>
  </g>
  <g stroke="#484f58" stroke-width="3" stroke-linecap="round">
    <line x1="260" y1="118" x2="296" y2="118"/><line x1="260" y1="130" x2="288" y2="130"/><line x1="260" y1="142" x2="292" y2="142"/>
    <line x1="382" y1="118" x2="418" y2="118"/><line x1="382" y1="130" x2="410" y2="130"/><line x1="382" y1="142" x2="414" y2="142"/>
    <line x1="504" y1="118" x2="540" y2="118"/><line x1="504" y1="130" x2="532" y2="130"/><line x1="504" y1="142" x2="536" y2="142"/>
    <line x1="626" y1="118" x2="662" y2="118"/><line x1="626" y1="130" x2="654" y2="130"/><line x1="626" y1="142" x2="658" y2="142"/>
  </g>

  <!-- newest block: mining, then confirmed -->
  <rect class="mining" x="736" y="100" width="60" height="60" rx="10" fill="#161b22" stroke="#f7931a" stroke-width="2" stroke-dasharray="7 6"/>
  <rect class="confirm" x="736" y="100" width="60" height="60" rx="10" fill="#f7931a" fill-opacity=".16" stroke="#f7931a" stroke-width="2.5"/>
  <g stroke="#f7931a" stroke-opacity=".85" stroke-width="3" stroke-linecap="round">
    <line class="tx1" x1="748" y1="118" x2="784" y2="118"/>
    <line class="tx2" x1="748" y1="130" x2="776" y2="130"/>
    <line class="tx3" x1="748" y1="142" x2="780" y2="142"/>
  </g>

  <!-- labels -->
  <g class="mono" font-size="12" text-anchor="middle">
    <text x="278" y="186" fill="#7d8590">genesis</text>
    <text class="lbl-mining" x="766" y="186" fill="#7d8590">mining...</text>
    <text class="lbl-ok" x="766" y="186" fill="#f7931a">confirmed</text>
  </g>

  <!-- coin -->
  <g transform="translate(125 130)">
    <g class="float">
      <circle class="glow" r="92" fill="url(#glow)"/>
      <g class="flip">
        <circle r="64" fill="url(#coinFace)"/>
        <circle r="62.5" fill="none" stroke="#c2620a" stroke-width="3"/>
        <circle r="55" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="2 4"/>
        <g transform="rotate(14) scale(1.12)" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M -14 -24 V 24"/>
          <path d="M -14 -24 H 4 Q 16 -24 16 -12 Q 16 0 4 0 H -14"/>
          <path d="M -14 0 H 7 Q 20 0 20 12 Q 20 24 7 24 H -14"/>
          <path d="M -6 -32 V -24 M 4 -32 V -24 M -6 24 V 32 M 4 24 V 32"/>
        </g>
        <g clip-path="url(#coinClip)">
          <g class="shine">
            <rect x="-112" y="-80" width="22" height="160" fill="#ffffff" opacity=".28" transform="skewX(-20)"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
