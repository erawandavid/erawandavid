name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # update otomatis tiap 12 jam
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#f7931a&color_dots=#ebedf0,#ffe1b8,#ffc06b,#fb9e2e,#f7931a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f7931a&color_dots=#161b22,#4a2a05,#7d470a,#bf6c10,#f7931a

      - name: Push SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
